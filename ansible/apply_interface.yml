---
- name: Apply desired Loopback interface state
  hosts: routers
  gather_facts: false
  vars:
    ansible_user: "{{ lookup('env', 'ROUTER_USER') }}"
    ansible_password: "{{ lookup('env', 'ROUTER_PASS') }}"
    ansible_become: true
    ansible_become_method: enable
    ansible_become_password: "{{ lookup('env', 'ROUTER_PASS') }}"
  tasks:
    - name: Replace managed Loopback configuration
      cisco.ios.ios_config:
        defaults: true
        parents:
          - "interface {{ interface_name }}"
        lines:
          - "description {{ description }}"
          - "ip address {{ ipv4_address }} {{ netmask }}"
          - "{{ 'shutdown' if shutdown else 'no shutdown' }}"
        match: exact
        replace: block
